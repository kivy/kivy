name: OSX wheels/app

on:
  push:
  pull_request:
  create:
  schedule:
    - cron:  '23 1 * * *'

env:
  KIVY_SPLIT_EXAMPLES: 1
  SERVER_IP: '159.203.106.198'
  CC: clang
  CXX: clang
  FFLAGS: '-ff2c'
  USE_SDL3: 1

jobs:
  kivy_examples_create:
    # we need examples wheel for tests, but only windows actually uploads kivy-examples to pypi/server
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Install CI/CD Python requirements
      run: |
        python -m pip install -r .ci/cicd-requirements.txt
    - name: Create wheel
      run: |
        python3 -m build --wheel --outdir dist packaging/kivy_examples
    - name: Upload kivy-examples wheel as artifact
      uses: actions/upload-artifact@v7
      with:
        name: osx_examples_wheel
        path: dist

  osx_wheels_create:
    if: (github.repository == 'kivy/kivy' && github.event_name == 'schedule') || (github.event_name == 'create' && github.event.ref_type == 'tag') || contains(github.event.head_commit.message, '[build wheel]') || contains(github.event.head_commit.message, '[build wheel osx]') || contains(github.event.pull_request.title, '[build wheel]') || contains(github.event.pull_request.title, '[build wheel osx]')
    env:
      CIBW_ENVIRONMENT: "MACOSX_DEPLOYMENT_TARGET=10.15"
      CIBW_BUILD: "cp311-macosx_universal2 cp312-macosx_universal2 cp313-macosx_universal2 cp314-macosx_universal2"
      CIBW_ARCHS_MACOS: "x86_64 universal2"
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
        DYLD_LIBRARY_PATH=$REPAIR_LIBRARY_PATH delocate-listdeps {wheel} &&
        DYLD_LIBRARY_PATH=$REPAIR_LIBRARY_PATH delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - runs_on: macos-latest
            python: '3.x'
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Cache macOS deps downloads
      uses: actions/cache@v5
      with:
        path: osx-cache
        key: ${{ runner.OS }}-build-${{ hashFiles('.ci/osx_ci.sh') }}
    - name: Generate version metadata
      run: |
        source .ci/ubuntu_ci.sh
        update_version_metadata
    - name: Install build dependencies
      run: |
        # ``meson`` is required by tools/build_thorvg.sh (static ThorVG
        # build for the kivy.lib.thorvg Cython wrapper); the rest are
        # existing SDL3 / libpng dependencies.
        brew install pkg-config cmake ninja meson
    - name: Build universal Kivy dependencies
      run: |
        ./tools/build_macos_dependencies.sh
    - name: Install CI/CD Python requirements
      run: |
        python -m pip install -r .ci/cicd-requirements.txt
    - name: Build wheels
      env:
        # ThorVG was built into kivy-dependencies/dist by
        # build_macos_dependencies.sh above; surface it as an extra
        # cibuildwheel environment so setup.py's
        # determine_thorvg_flags() finds it inside the isolated PEP 517
        # build environment (cibuildwheel does NOT inherit the outer
        # process env on macOS - CIBW_ENVIRONMENT is the hook).
        CIBW_ENVIRONMENT: "MACOSX_DEPLOYMENT_TARGET=10.15 KIVY_DEPS_ROOT=$(pwd)/kivy-dependencies"
      run: |
        export KIVY_DEPS_ROOT=$(pwd)/kivy-dependencies
        export REPAIR_LIBRARY_PATH=$KIVY_DEPS_ROOT/dist/Frameworks
        python -m cibuildwheel --output-dir wheelhouse
    - uses: actions/upload-artifact@v7
      with:
        name: osx_wheels
        path: ./wheelhouse/*.whl

  osx_wheel_upload:
    runs-on: macos-latest
    needs: osx_wheels_create
    if: github.repository == 'kivy/kivy' && github.event_name != 'pull_request'
    env:
      KIVY_GL_BACKEND: 'mock'
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Install CI/CD Python requirements
      run: |
        python -m pip install -r .ci/cicd-requirements.txt
    - uses: actions/download-artifact@v8
      with:
        name: osx_wheels
        path: dist
    - name: Rename wheels
      if: github.event.ref_type != 'tag'
      run: |
        source .ci/ubuntu_ci.sh
        rename_wheels
    - name: Upload wheels to server
      env:
        UBUNTU_UPLOAD_KEY: ${{ secrets.UBUNTU_UPLOAD_KEY }}
      run: |
        source .ci/ubuntu_ci.sh
        upload_file_to_server "$SERVER_IP" "osx/kivy/"
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*
        draft: true
    - name: Publish to PyPI
      if: github.event_name == 'create' && github.event.ref_type == 'tag'
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.pypi_password }}
      run: |
        twine upload dist/*

  osx_wheel_test:
    name: "osx_wheel_test (${{ matrix.runs_on }}, ${{ matrix.python }})"
    needs: [ osx_wheels_create, kivy_examples_create ]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        # macos-15-intel runs on Intel x64
        # macos-latest runs on Apple Silicon ARM
        runs_on: ['macos-15-intel', 'macos-latest']
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      KIVY_GL_BACKEND: 'mock'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python }} on ${{ matrix.runs_on }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: osx_wheels
          path: dist
      - name: Install Kivy wheel
        run: |
          source .ci/ubuntu_ci.sh
          install_kivy_wheel dev
      - uses: actions/download-artifact@v8
        with:
          name: osx_examples_wheel
          path: dist
      - name: Install kivy-examples wheel
        run: |
          source .ci/ubuntu_ci.sh
          install_kivy_examples_wheel dev
      - name: Test Kivy wheel
        run: |
          source .ci/ubuntu_ci.sh
          test_kivy_install

  osx_app_create:
    outputs:
      packager_sha: ${{ steps.build_app.outputs.packager_sha }}
    runs-on: macos-latest
    if: github.event_name != 'pull_request' && ((github.repository == 'kivy/kivy' && github.event_name == 'schedule') || (github.event_name == 'create' && github.event.ref_type == 'tag') || contains(github.event.head_commit.message, '[build app osx]')) || contains(github.event.pull_request.title, '[build app osx]')
    env:
      KIVY_SPLIT_EXAMPLES: 0
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Cache macOS deps downloads
        uses: actions/cache@v5
        with:
          path: osx-cache
          key: ${{ runner.OS }}-build-${{ hashFiles('.ci/osx_ci.sh') }}
      - name: Generate version metadata
        run: |
          source .ci/ubuntu_ci.sh
          update_version_metadata
      - name: Install build dependencies
        run: |
          brew install pkg-config cmake ninja meson
      - name: Install dependencies
        run: |
          source .ci/ubuntu_ci.sh
          source .ci/osx_ci.sh
          install_platypus
      - name: Make app bundle
        id: build_app
        run: |
          source .ci/osx_ci.sh
          generate_osx_app_bundle
      - name: Create dmg from bundle
        run: |
          source .ci/osx_ci.sh
          generate_osx_app_dmg_from_bundle
      - name: Upload dmg as artifact
        uses: actions/upload-artifact@v7
        with:
          name: osx_app
          path: app

  osx_app_upload_test:
    runs-on: macos-latest
    needs: [osx_app_create, kivy_examples_create]
    env:
      KIVY_GL_BACKEND: 'mock'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: actions/download-artifact@v8
        with:
          name: osx_app
          path: app
      - name: Rename app
        if: github.event.ref_type != 'tag'
        run: |
          py_version=$(python3 -c "import platform; print(platform.python_version())")
          source .ci/osx_ci.sh
          rename_osx_app "$py_version"
      - name: Upload app to server
        env:
          UBUNTU_UPLOAD_KEY: ${{ secrets.UBUNTU_UPLOAD_KEY }}
        run: |
          source .ci/ubuntu_ci.sh
          upload_file_to_server "$SERVER_IP" "osx/app/" "*.dmg" "app"
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/*
          draft: true
      - name: Mount Kivy.app
        run: |
          source .ci/osx_ci.sh
          mount_osx_app
      - uses: actions/download-artifact@v8
        with:
          name: osx_examples_wheel
          path: dist
      - name: Diagnose installed-app test discovery
        run: |
          source .ci/osx_ci.sh
          activate_osx_app_venv
          cd "$HOME"

          if KIVY_LOG_MODE=PYTHON KIVY_NO_CONSOLELOG=1 python3 - <<'PY'
          import importlib.util
          import sys
          import kivy

          print("Python:", sys.executable, sys.version, flush=True)
          print("Kivy:", kivy.__file__, kivy.__version__, flush=True)
          print("pytest:", importlib.util.find_spec("pytest"), flush=True)
          import kivy.tests as tests
          print("Installed tests:", tests.__path__[0], flush=True)
          PY
          then
            printf '%s\n' 'Installed tests are importable before bootstrap.'
          else
            printf '%s\n' 'Pre-bootstrap test import failed; see traceback above.'
          fi
      - name: Require app-build packager revision
        env:
          PACKAGER_SHA: ${{ needs.osx_app_create.outputs.packager_sha }}
        run: |
          if [ -z "$PACKAGER_SHA" ]; then
            printf '%s\n' 'The app build did not report its packager revision.' >&2
            exit 1
          fi
      - name: Check out matching packager preparation tools
        uses: actions/checkout@v7
        with:
          repository: kivy/kivy-sdk-packager
          ref: ${{ needs.osx_app_create.outputs.packager_sha }}
          path: .ci/packager-test-tools
      - name: Install test dependencies
        env:
          PACKAGER_SHA: ${{ needs.osx_app_create.outputs.packager_sha }}
        run: |
          source .ci/osx_ci.sh
          source .ci/ubuntu_ci.sh
          activate_osx_app_venv
          install_osx_app_test_dependencies \
            "$GITHUB_WORKSPACE/.ci/packager-test-tools/osx" "$PACKAGER_SHA"
          install_kivy_examples_wheel ""
      - name: Test Kivy app
        run: |
          source .ci/osx_ci.sh
          source .ci/ubuntu_ci.sh
          activate_osx_app_venv
          test_kivy_install
      - name: Upload app-test bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osx_app_test_bootstrap_evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/kivy-app-test-deps.*/dev.in
            ${{ runner.temp }}/kivy-app-test-deps.*/constraints.txt
            ${{ runner.temp }}/kivy-app-test-deps.*/dev.txt
            ${{ runner.temp }}/kivy-app-test-deps.*/selected-wheels.json
            ${{ runner.temp }}/kivy-app-test-deps.*/installed-dev.json
            ${{ runner.temp }}/kivy-app-test-deps.*/native-dev-binaries.json
            ${{ runner.temp }}/kivy-app-test-deps.*/kivy-before.json
            ${{ runner.temp }}/kivy-app-test-deps.*/kivy-after.json
